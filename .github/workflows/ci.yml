name: CI

on:
  push:
    branches: [test]
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:

#### ---------------------------------
  ## Git Leak scan
#### ----------------------------------

  gitleaks_scan:
    name: GitLeaks Secret Scan

    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
           fetch-depth: 0

      # Run GitLeaks
      - name: Run GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          

  test:
    name: Build Test Trivy Scan
    needs: gitleaks_scan
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Run Backend Tests
      - name: Run Backend Tests
        working-directory: ./backend
        run: |
          go test ./...

  #### ---------------------------------
   ## Hadolint Dockerfile Scan
  #### ---------------------------------
  hadolint-scan:
    name: Hadolint Dockerfile Scan
    needs:  test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Backend Dockerfile Scan
      - name: Scan Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      # Frontend Dockerfile Scan
      - name: Scan Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
#### ---------------------------------
## Build + Trivy Scan
#### --------------------------------- 
  build-trivy:
    name: Build Docker Images and Run Trivy Scan
    needs: hadolint-scan
    runs-on: ubuntu-latest

    steps:

      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend Docker Image
      - name: Build Backend Docker Image
        run: |
          docker build -t skillpulse-backend ./backend

      # Build Frontend Docker Image
      - name: Build Frontend Docker Image
        run: |
          docker build -t skillpulse-frontend ./frontend

      # Trivy Scan Backend Image
      - name: Trivy Scan Backend Image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: skillpulse-backend
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          cache: 'true'

      # Trivy Scan Frontend Image
      - name: Trivy Scan Frontend Image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: skillpulse-frontend
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          cache: 'true'

#### ---------------------------------
  ## Build Docker Images and push to docker hub
#### ---------------------------------
  build-and-push:
    name: Build Docker Images and push to docker hub
    needs: build-trivy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ vars.DEPLOY_ENABLED == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/skillpulse-backend:latest', secrets.DOCKERHUB_USERNAME) || 'skillpulse-backend:latest' }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/skillpulse-backend:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || format('skillpulse-backend:{0}', github.sha) }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ vars.DEPLOY_ENABLED == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/skillpulse-frontend:latest', secrets.DOCKERHUB_USERNAME) || 'skillpulse-frontend:latest' }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/skillpulse-frontend:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || format('skillpulse-frontend:{0}', github.sha) }}
